[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "clap2-scenes"
version = "1.0.0"
description = "CLAP2 audio scene segmentation and nearest-neighbor caption retrieval"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = ["numpy>=2.1,<3", "scipy>=1.15,<2", "torch>=2.7,<3", "torchaudio>=2.7,<3", "open_clip_torch==4.2.2", "huggingface_hub>=1,<2", "soundfile>=0.13,<1", "tiktoken>=0.12,<1", "ftfy>=6.3,<7"]

[project.optional-dependencies]
api = ["fastapi>=0.135,<1", "uvicorn>=0.42,<1", "python-multipart>=0.0.20"]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "matplotlib>=3.9,<4", "pyarrow>=19"]

[project.scripts]
clap2-scenes = "clap2_scenes.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
clap2_scenes = ["*.json", "data/*.gz"]

[tool.pytest.ini_options]
testpaths = ["tests"]
